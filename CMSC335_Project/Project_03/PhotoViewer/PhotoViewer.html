<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Photo Viewer</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="code.js" defer></script>
</head>

<body>
    <h1>Photo Viewer</h1>
    <div class="flexBox"><img id="Image" src="./InitialImage.jpg" width="444" height="293" alt="animationImg"></div>
    <br>
    <form>
        <fieldset>
            <legend>
                <strong>Status</strong>
            </legend>
            <label for="PhotoBeingDisplayed">Photo Being Displayed: <input id="PhotoBeingDisplayed" type="text" disabled value="InitialImage.jpg"></label>
            <br><br>
            <div id="DisplayMessage">Photo Viewer System</div>
        </fieldset>

        <fieldset>
            <legend>
                <strong>Loading Images (Local Folder)</strong>
            </legend>
            <label for="PhotosFolder">Photos' Folder: <input id="PhotosFolder" type="text" value="umcp/"></label>
            <label for="CommonName">Common Name: <input id="CommonName" type="text" value="college"></label>
            <br><br>
            <label for="StartPhotoNumber">Start Photo Number: <input id="StartPhotoNumber" type="text" value="2"></label>
            <label for="EndPhotoNumber">End Photo Number: <input id="EndPhotoNumber" type="text" value="4"></label>
            <br><br>
            <button type="button" onclick="loadPhotos()">Load Photos</button>
        </fieldset>

        <fieldset>
            <legend>
                <strong>Loading Images (JSON File)</strong>
            </legend>
            <label for="URL">URL: <input id="URL" type="text" value=""></label>
            <button type="button" onclick="loadJSON()">Load JSON</button>
        </fieldset>

        <fieldset>
            <legend>
                <strong>Iterating</strong>
            </legend>
            <button type="button" onclick="previousPhoto()">Previous Photo</button>
            <button type="button" onclick="nextPhoto()">Next Photo</button>
            <button type="button" onclick="firstPhoto()">First Photo</button>
            <button type="button" onclick="lastPhoto()">Last Photo</button>
        </fieldset>

        <fieldset>
            <legend>
                <strong>SlideShows</strong>
            </legend>
            <button type="button" onclick="slideShow()">SlideShow</button>
            <button type="button" onclick="randomSlideShow()">RandomSlideShow</button>
            <button type="button" onclick="stopSlideShow()">StopSlideShow</button>
        </fieldset>
        <hr>
        <input id="Reset" type="reset" value="Reset Form Values"> 
    </form>
</body>

</html>
