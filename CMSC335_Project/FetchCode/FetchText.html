<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Fetch</title>
      <meta charset="utf-8" />
   </head>

   <body>
      <h2>Open console for results</h2>
      <script>
         const url = "https://jsonplaceholder.typicode.com/todos/1"; // Notice the 1 at the end
         console.log(`Retrieving data from ${url}`);

         fetch(url)
            .then(response => response.text()) // Process response by retrieving text
            .then(text => console.log(text)); // Displaying text
      </script>
   </body>
</html>
