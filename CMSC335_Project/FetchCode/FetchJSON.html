<!DOCTYPE html>
<html lang="en">

<head>
    <title>Fetch</title>
    <meta charset="utf-8">
</head>

<body>
    <h2>Open console for results</h2>
    <script>
        const url = "https://jsonplaceholder.typicode.com/todos/1"; // Notice the 1 at the end
        console.log(`Retrieving data from ${url}`);
        
        fetch(url)
            .then(response => response.json())
            .then(json => console.log(json));

        // Check WHERE this message appears in the console
        console.log("***** END OF SCRIPT *****"); 
    </script>
</body>

</html>
