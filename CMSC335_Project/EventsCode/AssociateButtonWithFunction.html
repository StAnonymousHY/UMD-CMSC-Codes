<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Associate Button with Function</title>
</head>

<!-- Important; we are executing main() once document is ready -->
<!-- If we move the buttons before <script> we don't need to rely on onload -->
<body onload="main()"> 
    <script>
        /*
         * main is now being called in <body> onload = "main()" says:
         * "execute main when page has been created"
         */
        function main() {
            /* Next statement allow us to access the button from JavaScript */
            const buttonInHTMLForm = document.getElementById("displayMessageButton");

            /* Following assignment says: when the button is clicked on call the displayValue function */
            buttonInHTMLForm.onclick = displayMessage; // DO NOT PUT ()

            document.querySelector("#displayTimeButton").addEventListener("click", () => alert(new Date()));
        }

        function displayMessage() { alert("Fear the turtle"); }
        function displaySchoolName() { alert("UMCP"); }
    </script>

    <!-- Notice we are not using a form -->
    <button type="button" id="displayMessageButton">Display Message</button>
    <button type="button" onclick="displaySchoolName()">Display School Name</button>
    <button type="button" id="displayTimeButton">Display Time</button>
</body>

</html>
