<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>setTimeout</title>
</head>

<body>
    <script>
        "use strict";
        
        function message() {
            document.writeln("To C or not to C :)")
        }

        const delayInMilliSeconds = 4000;
        setTimeout("message()", delayInMilliSeconds);

        document.writeln(`Message will appear in about ${delayInMilliSeconds / 1000} seconds`);
    </script>
</body>

</html>
