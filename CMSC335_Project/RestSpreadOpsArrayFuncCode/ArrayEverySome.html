<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>JS Array every and some method Example</title>
</head>

<body>
    <script>
        "use strict";

        /* Index and array are optional */
        function isOdd(elem, index, array) {
            document.write(`elem: ${elem} index: ${index} array: ${array}<br>`);
            return elem % 2 === 1;
        }
        const value = 1; /* Try with value = 2 */
        const atLeastOneOdd = [2, 6, 8, value, 4].some(isOdd);
        document.writeln(`=====<br>`);
        const allOdd1 = [2, 6, 8, 1, 4].every(isOdd);
        document.writeln(`=====<br>`);
        const allOdd2 = [1, 3, 5, 9, 7].every(isOdd);
        document.writeln(`=====<br>`);

        document.writeln(`atLeastOneOdd: ${atLeastOneOdd}<br>`);
        document.writeln(`allOdd1: ${allOdd1}<br>`);
        document.writeln(`allOdd2: ${allOdd2}<br>`);
    </script>
</body>

</html>
