<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <title>Promises Intro</title>
   </head>

   <body>
      <script>

         /* 
           We don't have an actual asynchronous task; using it to show 
           how to use a promise. 
          */
         async function getRandomQuote() {
            const quotes = ["To C or not to C", "Believe and it will compile"];
            const index = Math.floor(Math.random() * 2);
            return quotes[index];
         }

         async function main() {
            const quote = await getRandomQuote();

            document.writeln(quote);
            document.writeln("<br>Done<br>");
         }

         main();
      </script>
   </body>
</html>
