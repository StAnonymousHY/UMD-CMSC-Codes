<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>JS Example</title>
</head>

<body>
    <h2>Hello Area</h2>
    <div id="helloDisplay"></div>
    
    <h2>Numbers area</h2>
    <div id="numbersDisplay"></div>
        
    <script>   
      setInterval(() => document.getElementById("helloDisplay").innerHTML += "Hello ", 1000); 
      let value = 1, limit = 4000;
      do {
         document.getElementById("numbersDisplay").innerHTML += value;
         value++;
      } while(value <= limit); 
       
    </script>
</body>

</html>
