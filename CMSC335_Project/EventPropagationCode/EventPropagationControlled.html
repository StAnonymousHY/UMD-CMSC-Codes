<!DOCTYPE html>
<html lang="en">

<head>
  <title>Example</title>
  <meta charset="utf-8">
  <style>
    #OuterElement {border: 0.25em solid red;}
    #InnerElement {border: 0.25em solid blue;}
    #WayInnerElement {border: 0.25em solid green;}
  </style>
</head>

<body>
  <h1>See console for results after clicking on areas</h1>
  <div id="OuterElement">
    This text is part of the outer element.<br><br><br>
    <div id="InnerElement">
      &nbsp;&nbsp;This text is part of the inner element.<br><br><br>
      <div id="WayInnerElement">
        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;This text is part of the way inner
        element :)<br><br><br>
      </div>
    </div>
  </div>
  <h3>Which One Was Selected</h3>
  <div id="display"></div>

  <script>
    function display(str) { document.querySelector("#display").innerHTML += `${str}<br>`;}
    const capturingPhase = false; // update to see effect
    display(`Capturing: ${capturingPhase}`);
    document.getElementById("OuterElement")
            .addEventListener("click", () => display("OuterElement"), capturingPhase);
    document.getElementById("InnerElement")
            .addEventListener("click", () => display("InnerElement"), capturingPhase);
    document.getElementById("WayInnerElement")
            .addEventListener("click", () => display("WayInnerElement"), capturingPhase);
  </script>
</body>

</html>
