<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Class Example</title>
</head>

<body>
    <script>
        "use strict";

        class Car {
            static dealership = "Terp Cars"; /* static public */
            static #instances = 0; /* static private */

            passengers = ["Rose"]; /* public */
            #tag; #mileage; /* private */

            constructor(tag, mileage) {
                this.#tag = tag;
                this.#mileage = mileage;
                Car.#instances++;
            }

            displayInfo() {
                document.writeln(`Tag: ${this.#tag}, Mileage: ${this.#mileage}, Passengers: ${this.passengers}`);
            }

            [Symbol.toPrimitive]() {
                /* Java's toString() */
                return `Tag: ${this.#tag}, Mileage: ${this.#mileage}, Passengers: ${this.passengers}`;
            }

            get tag() {
                return this.#tag;
            }

            static getInstances() {
                return Car.#instances;
            }
        }

        class SportsCar extends Car {
            #engine;
            constructor(tag, mileage, engine) {
                super(tag, mileage);
                this.#engine = engine;
            }

            displayInfo() {
                super.displayInfo();  // Calling super class method
                document.writeln(`Engine: ${this.#engine}<br>`);
            }

            [Symbol.toPrimitive]() { // Call super class "toString()"
                return `${super[Symbol.toPrimitive]()}, Engine: ${this.#engine}`;
            }

            get engine() {
                return this.#engine;
            }
        } 

        const car = new Car("Nelyota", 50000);
        document.writeln(`Mark #1: car info:<br> ${car}<br><br>`)
        const sportsCar = new SportsCar("X2W-Sports", 22000, "turbo");
        document.writeln(`Mark #2: Sports car info:<br> ${sportsCar}<br><br>`);
        document.writeln(`Mark #3: Engine: ${sportsCar.engine}<br><br>`);
        document.writeln(`Mark #4: Tag: ${sportsCar.tag}<br><br>`);
        document.writeln(`Mark #5: Total Cars: ${Car.getInstances()}<br><br>`);
        document.writeln(`Mart #6: Using displayInfo()<br>`);
        sportsCar.displayInfo();
        
    </script>
</body>

</html>
