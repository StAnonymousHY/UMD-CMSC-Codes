<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>typeof and instanceof</title>
</head>

<body>
    <script>
        "use strict";

        const name = "Peter", gpa = 4.0, hungry = true;
        let undefinedVariable;
        const nullVariable = null;
        const mySymbol = Symbol("A");
        const infoObj = { name: "John", id: 10 };
        const scoresArray = [10, 30];
        const myBigint = 123456789n;
        function printSchoolName() { document.writeln("UMCP"); }

        document.writeln(`<h2>typeof Examples</h2>`);
        document.writeln(`typeof ${name}: ${typeof name} <br>`);
        document.writeln(`typeof gpa: ${typeof gpa} <br>`);
        document.writeln(`typeof hungry: ${typeof hungry} <br>`);
        document.writeln(`typeof undefinedVariable: ${typeof undefinedVariable}<br>`);
        document.writeln(`typeof nullVariable: ${nullVariable}<br>`);
        document.writeln(`typeof mySymbol: ${typeof mySymbol}<br>`);
        document.writeln(`typeof infoObj: ${typeof infoObj}<br>`);
        document.writeln(`typeof scoresArray: ${typeof scoresArray}<br>`);
        document.writeln(`typeof myBigint: ${typeof myBigint}<br>`);
        document.writeln(`typeof printSchoolName: ${typeof printSchoolName}`);

        document.writeln(`<h2>instanceof Examples</h2>`);
        document.writeln(`infoObj instance of Object: ${infoObj instanceof Object}<br>`);
        document.writeln(`scoresArray instance of Object: ${scoresArray instanceof Object}<br>`);
        document.writeln(`scoresArray instance of Array: ${scoresArray instanceof Array}<br>`);
        document.writeln(`printArray instance of Function: ${printSchoolName instanceof Function}<br>`);
        document.writeln(`printArray instance of Object: ${printSchoolName instanceof Object}<br>`);

        document.writeln(`<h2>Array.isArray Examples</h2>`);
        document.writeln(`Array.isArray(infoObj): ${Array.isArray(infoObj)}<br>`);
        document.writeln(`Array.isArray(scoresArray): ${Array.isArray(scoresArray)}<br>`);
        document.writeln(`Array.isArray(printSchoolName): ${Array.isArray(printSchoolName)}<br>`);
    </script>
</body></html>
