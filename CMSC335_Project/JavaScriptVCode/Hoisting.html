<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Scope example</title>
</head>

<body>
	<script>
	"use strict";
    
	document.writeln(`Initial value of temp is ${temp}<br>`);

	main();
	
	function main() {
        let value = 200; /* Try with 10 */
		document.writeln(`Result in main: ${evaluate(value)}<br>`);
	}

	temp = 3456; // temp is hoisted

		if (x >= 100) {
            var y = x * 100;
            document.writeln(`Inside of if stmt value of y is ${y}<br>`);
        }
		return y;  // Accessible
    }

	document.writeln(`Final value of temp is ${temp}<br>`);


	</script>
</body>
</html>
